<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carrinho — Real Stiles</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .carrinho-layout { display:grid; grid-template-columns:1fr 360px; gap:32px; padding:40px 5%; max-width:1100px; margin:0 auto; }
    .carrinho-item { display:flex; gap:16px; padding:16px; border:1px solid var(--gray-200); border-radius:12px; background:white; margin-bottom:12px; }
    .carrinho-item img { width:72px; height:96px; object-fit:cover; border-radius:8px; flex-shrink:0; }
    .ci-info { flex:1; }
    .ci-nome { font-weight:600; font-size:15px; margin-bottom:4px; }
    .ci-detalhe { font-size:12px; color:var(--gray-400); margin-bottom:8px; }
    .ci-preco { font-weight:700; font-size:16px; }
    .ci-qty { display:flex; align-items:center; gap:8px; margin-top:8px; }
    .ci-qty button { width:28px; height:28px; border:1px solid var(--gray-200); border-radius:6px; background:white; cursor:pointer; font-size:16px; display:flex; align-items:center; justify-content:center; }
    .ci-qty span { font-weight:600; min-width:20px; text-align:center; }
    .ci-remove { background:none; border:none; cursor:pointer; color:var(--gray-400); font-size:18px; align-self:flex-start; padding:4px; }
    .ci-remove:hover { color:var(--red); }
    .resumo-card { background:white; border:1px solid var(--gray-200); border-radius:16px; padding:24px; position:sticky; top:calc(var(--nav-h) + 20px); height:fit-content; }
    .resumo-row { display:flex; justify-content:space-between; font-size:14px; margin-bottom:12px; color:var(--gray-600); }
    .resumo-total { display:flex; justify-content:space-between; font-size:18px; font-weight:700; padding-top:12px; border-top:1px solid var(--gray-200); margin-top:4px; }
    @media(max-width:768px){ .carrinho-layout{grid-template-columns:1fr;} }
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo"><img src="img/logo.png" alt="Real Stiles" style="height:52px;"/></a>
  <div class="nav-actions" style="margin-left:auto">
    <div id="nav-auth"><a href="conta.html" class="btn btn-outline btn-sm">Entrar</a></div>
    <div id="nav-user" style="display:none;align-items:center;gap:12px;">
      <span id="nav-nome" style="font-size:14px;font-weight:500;"></span>
      <button onclick="window._logout()" class="btn btn-outline btn-sm">Sair</button>
    </div>
    <a href="carrinho.html" class="nav-cart-btn">🛒 <span class="cart-count" style="display:none">0</span></a>
  </div>
</nav>

<div class="page-wrapper">
  <div class="carrinho-layout">
    <!-- ITENS -->
    <div>
      <h1 style="font-family:'Playfair Display',serif;font-size:1.8rem;margin-bottom:24px;">O teu carrinho</h1>
      <div id="carrinho-items"></div>
    </div>

    <!-- RESUMO + CHECKOUT -->
    <div>
      <div class="resumo-card">
        <h2 style="font-size:16px;font-weight:600;margin-bottom:20px;">Resumo do pedido</h2>
        <div class="resumo-row"><span>Subtotal</span><span id="subtotal">0.00 MZN</span></div>
        <div class="resumo-row"><span>Entrega</span><span>A combinar</span></div>
        <div class="resumo-total"><span>Total</span><span id="total">0.00 MZN</span></div>

        <div id="form-checkout" style="margin-top:20px;display:none;">
          <div style="border-top:1px solid var(--gray-200);padding-top:20px;margin-bottom:16px;">
            <h3 style="font-size:14px;font-weight:600;margin-bottom:16px;">Dados de entrega</h3>
          </div>
          <div class="form-group">
            <label>Morada completa *</label>
            <input type="text" id="morada" placeholder="Rua, número, bairro"/>
          </div>
          <div class="form-group">
            <label>Cidade *</label>
            <input type="text" id="cidade" placeholder="Nampula, Maputo..."/>
          </div>
          <div class="form-group">
            <label>Telefone de contacto *</label>
            <input type="tel" id="telefone" placeholder="+258 84 000 0000"/>
          </div>
          <div class="form-group">
            <label>Notas (opcional)</label>
            <textarea id="notas" rows="2" placeholder="Instruções especiais..."></textarea>
          </div>
          <button class="btn btn-primary btn-full btn-lg" onclick="confirmarEncomenda()" id="btn-encomendar">
            Confirmar encomenda
          </button>
        </div>

        <div id="btn-checkout-wrap" style="margin-top:20px;">
          <button class="btn btn-primary btn-full btn-lg" onclick="iniciarCheckout()" id="btn-checkout">
            Finalizar compra
          </button>
          <a href="index.html" class="btn btn-outline btn-full" style="margin-top:8px;text-align:center">
            Continuar a comprar
          </a>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { initNav, logout, onAuthChange } from './js/auth.js';
  import { getCarrinho, renderCarrinho, getTotalPreco, getTotalItems, actualizarContador } from './js/carrinho.js';
  import { criarEncomenda } from './js/encomendas.js';
  import { mostrarToast } from './js/carrinho.js';

  initNav();
  actualizarContador();
  window._logout = logout;

  function actualizarResumo() {
    const total = getTotalPreco();
    document.getElementById('subtotal').textContent = total.toFixed(2) + ' MZN';
    document.getElementById('total').textContent = total.toFixed(2) + ' MZN';
  }

  renderCarrinho('carrinho-items');
  actualizarResumo();
  window.addEventListener('carritoUpdated', () => { renderCarrinho('carrinho-items'); actualizarResumo(); });

  window.iniciarCheckout = () => {
    if (getTotalItems() === 0) return mostrarToast('O carrinho está vazio', 'error');
    onAuthChange((user) => {
      if (!user) { window.location.href = 'conta.html?redirect=carrinho.html'; return; }
      document.getElementById('btn-checkout-wrap').style.display = 'none';
      document.getElementById('form-checkout').style.display = 'block';
    });
  };

  window.confirmarEncomenda = async () => {
    const morada = document.getElementById('morada').value.trim();
    const cidade = document.getElementById('cidade').value.trim();
    const telefone = document.getElementById('telefone').value.trim();
    if (!morada || !cidade || !telefone) return mostrarToast('Preenche todos os campos obrigatórios', 'error');

    const btn = document.getElementById('btn-encomendar');
    btn.disabled = true; btn.textContent = 'A processar...';

    try {
      const itens = getCarrinho();
      const id = await criarEncomenda({ itens, morada, cidade, telefone, notas: document.getElementById('notas').value });
      mostrarToast('Encomenda realizada com sucesso! 🎉', 'success');
      setTimeout(() => window.location.href = `encomendas.html?nova=${id}`, 1500);
    } catch (e) {
      mostrarToast(e.message === 'Não autenticado' ? 'Tens de fazer login primeiro' : 'Erro ao processar. Tenta novamente.', 'error');
      btn.disabled = false; btn.textContent = 'Confirmar encomenda';
    }
  };
</script>
</body>
</html>
