<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Encomendas — Real Stiles</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    .filtros-estado {
      display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 28px;
    }
    .filtro-estado-btn {
      padding: 8px 18px; border-radius: 100px; font-size: 13px; font-weight: 500;
      border: 1.5px solid var(--gray-200); background: white; color: var(--gray-600);
      cursor: pointer; transition: all 0.15s; font-family: 'Inter', sans-serif;
    }
    .filtro-estado-btn:hover { border-color: var(--black); color: var(--black); }
    .filtro-estado-btn.active { background: var(--black); color: white; border-color: var(--black); }
    .enc-card {
      background: white; border: 1px solid var(--gray-200);
      border-radius: 16px; padding: 24px; margin-bottom: 16px;
      transition: box-shadow 0.2s;
    }
    .enc-card:hover { box-shadow: var(--shadow); }
    .enc-card-header {
      display: flex; justify-content: space-between; align-items: flex-start;
      flex-wrap: wrap; gap: 12px; margin-bottom: 16px;
    }
    .enc-id-data { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .enc-itens-preview {
      display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px;
    }
    .enc-item-chip {
      display: flex; align-items: center; gap: 8px;
      background: var(--gray-100); padding: 8px 12px; border-radius: 8px;
    }
    .enc-item-chip img {
      width: 28px; height: 36px; object-fit: cover; border-radius: 4px; background: white;
    }
    .enc-item-chip-info p { font-size: 12px; font-weight: 500; line-height: 1.3; }
    .enc-item-chip-info small { font-size: 11px; color: var(--gray-400); }
    .enc-card-footer {
      display: flex; justify-content: space-between; align-items: center;
      padding-top: 14px; border-top: 1px solid var(--gray-200); flex-wrap: wrap; gap: 10px;
    }
    .enc-nota-admin {
      margin-top: 12px; background: var(--accent-light);
      padding: 10px 14px; border-radius: 8px; font-size: 13px;
      border-left: 3px solid var(--accent);
    }
    .enc-nota-admin strong { color: var(--accent-dark); }
  </style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo"><img src="img/logo.png" alt="Real Stiles" style="height:52px;"/></a>
  <ul class="nav-links">
    <li><a href="index.html">Loja</a></li>
    <li><a href="quem-somos.html">Quem Somos</a></li>
    <li><a href="index.html?cat=camisas">Camisas</a></li>
    <li><a href="index.html?cat=calças">Calças</a></li>
    <li><a href="index.html?cat=vestidos">Vestidos</a></li>
    <li><a href="index.html?cat=casacos">Casacos</a></li>
  </ul>
  <div class="nav-actions">
    <div id="nav-auth"><a href="conta.html" class="btn btn-outline btn-sm">Entrar</a></div>
    <div id="nav-user">
      <span id="nav-nome" style="font-size:14px;font-weight:500;"></span>
      <a href="encomendas.html" class="active" style="font-size:13px;color:var(--black);text-decoration:none;font-weight:500;">Encomendas</a>
      <a id="nav-admin-link" href="admin/index.html" style="display:none;font-size:13px;color:var(--accent);text-decoration:none;font-weight:600;">Admin</a>
      <button onclick="window._logout()" class="btn btn-outline btn-sm">Sair</button>
    </div>
    <a href="carrinho.html" class="nav-cart-btn">🛒 <span class="cart-count" style="display:none">0</span></a>
  </div>
  <button class="nav-menu-btn" onclick="document.querySelector('.nav-links').classList.toggle('open')">
    <span></span><span></span><span></span>
  </button>
</nav>

<div class="page-wrapper">
  <div class="container" style="max-width:900px;">
    <div class="page-header">
      <h1>As minhas encomendas</h1>
      <p>Histórico de todas as tuas encomendas</p>
    </div>

    <!-- Alerta nova encomenda -->
    <div id="alerta-nova" style="display:none;background:#D1FAE5;color:#065F46;padding:16px 20px;border-radius:12px;margin-bottom:24px;font-weight:500;">
      ✅ Encomenda realizada com sucesso! Entraremos em contacto em breve.
    </div>

    <!-- Filtros -->
    <div class="filtros-estado" id="filtros">
      <button class="filtro-estado-btn active" data-estado="" onclick="filtrar('', this)">Todas</button>
      <button class="filtro-estado-btn" data-estado="pendente" onclick="filtrar('pendente', this)">⏳ Pendentes</button>
      <button class="filtro-estado-btn" data-estado="confirmada" onclick="filtrar('confirmada', this)">✅ Confirmadas</button>
      <button class="filtro-estado-btn" data-estado="enviada" onclick="filtrar('enviada', this)">🚚 Enviadas</button>
      <button class="filtro-estado-btn" data-estado="entregue" onclick="filtrar('entregue', this)">📦 Entregues</button>
      <button class="filtro-estado-btn" data-estado="cancelada" onclick="filtrar('cancelada', this)">❌ Canceladas</button>
    </div>

    <div id="encomendas-lista">
      <div class="loading"><div class="spinner"></div> A carregar...</div>
    </div>
  </div>
</div>

<div id="toast"></div>

<!-- WhatsApp flutuante -->
<a class="whatsapp-float" href="https://wa.me/258878753754" target="_blank" rel="noopener" aria-label="Contactar via WhatsApp">
  <span class="whatsapp-float-tooltip">+258 87 875 3754</span>
  <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:30px;height:30px;fill:white">
    <path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/>
  </svg>
</a>

<script type="module">
  import { requireAuth, logout, initNav } from './js/auth.js';
  import { getEncomendasCliente, badgeEstado, formatarData } from './js/encomendas.js';
  import { actualizarContador, initCarrinhoDrawer } from './js/carrinho.js';

  initNav();
  actualizarContador();
  initCarrinhoDrawer();
  window._logout = logout;

  const params = new URLSearchParams(window.location.search);
  if (params.get('nova')) document.getElementById('alerta-nova').style.display = 'block';

  const user = await requireAuth();
  let todasEncomendas = [];

  todasEncomendas = await getEncomendasCliente(user.uid);
  renderLista(todasEncomendas);

  window.filtrar = (estado, btn) => {
    document.querySelectorAll('.filtro-estado-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    const filtradas = estado ? todasEncomendas.filter(e => e.estado === estado) : todasEncomendas;
    renderLista(filtradas);
  };

  function renderLista(encomendas) {
    const container = document.getElementById('encomendas-lista');

    if (encomendas.length === 0) {
      container.innerHTML = `
        <div class="empty-state">
          <div class="icon">📦</div>
          <h3>Sem encomendas nesta categoria</h3>
          <p>Tenta outro filtro ou vai às compras.</p>
          <a href="index.html" class="btn btn-primary" style="margin-top:20px">Ir às compras</a>
        </div>`;
      return;
    }

    container.innerHTML = encomendas.map(e => `
      <div class="enc-card">
        <div class="enc-card-header">
          <div class="enc-id-data">
            <code style="font-size:13px;background:var(--gray-100);padding:4px 10px;border-radius:6px;">#${e.id.substring(0,8).toUpperCase()}</code>
            <span style="font-size:13px;color:var(--gray-400);">${formatarData(e.criado_em)}</span>
          </div>
          ${badgeEstado(e.estado)}
        </div>

        <div class="enc-itens-preview">
          ${(e.itens || []).slice(0, 4).map(i => `
            <div class="enc-item-chip">
              <img src="${i.imagem || 'https://via.placeholder.com/28x36?text=?'}" alt="${i.nome}"
                onerror="this.src='https://via.placeholder.com/28x36?text=?'"/>
              <div class="enc-item-chip-info">
                <p>${i.nome.length > 24 ? i.nome.substring(0,24) + '…' : i.nome}</p>
                <small>${i.tamanho ? i.tamanho + ' · ' : ''}× ${i.quantidade}</small>
              </div>
            </div>
          `).join('')}
          ${(e.itens || []).length > 4 ? `<div class="enc-item-chip" style="color:var(--gray-400);font-size:13px;">+${e.itens.length - 4} mais</div>` : ''}
        </div>

        <div class="enc-card-footer">
          <span style="font-size:13px;color:var(--gray-600);">${e.cidade_entrega || e.morada_entrega || '—'}</span>
          <div style="display:flex;align-items:center;gap:16px;">
            <strong style="font-size:17px;">${e.total?.toFixed(2)} MZN</strong>
            <a href="encomenda.html?id=${e.id}" class="btn btn-outline btn-sm">Ver detalhe →</a>
          </div>
        </div>

        ${e.notas_admin ? `
          <div class="enc-nota-admin">
            <strong>Mensagem da loja: </strong>${e.notas_admin}
          </div>` : ''}
      </div>
    `).join('');
  }
</script>
</body>
</html>
