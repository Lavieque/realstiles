<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 14px;
      color: #1a1a1a;
      background: #fff;
    }
    .header {
      background: #111;
      color: #fff;
      padding: 14px 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header-logo { font-size: 20px; }
    .header-title { font-weight: 700; font-size: 15px; }
    .header-sub { font-size: 11px; color: #aaa; margin-top: 1px; }
    .body { padding: 16px; }
    .domain-box {
      background: #f5f5f5;
      border-radius: 8px;
      padding: 10px 14px;
      margin-bottom: 14px;
      font-size: 13px;
      color: #555;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .domain-name { font-weight: 600; color: #111; font-size: 14px; }
    .btn {
      width: 100%;
      padding: 11px;
      border-radius: 8px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity .15s;
    }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn-primary { background: #111; color: #fff; }
    .btn-primary:hover:not(:disabled) { background: #333; }
    .btn-outline { background: #fff; color: #555; border: 1px solid #ddd; margin-top: 8px; }
    .btn-outline:hover:not(:disabled) { background: #f5f5f5; }
    .status {
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      display: none;
    }
    .status.success { background: #f0fdf4; color: #166534; display: block; }
    .status.error   { background: #fef2f2; color: #991b1b; display: block; }
    .status.loading { background: #f5f5f5; color: #555; display: block; }
    .count { font-size: 12px; color: #888; margin-top: 10px; text-align: center; }
    .not-configured {
      padding: 16px;
      text-align: center;
      color: #888;
      font-size: 13px;
      line-height: 1.6;
    }
    .not-configured strong { color: #111; display: block; margin-bottom: 6px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-logo">🍪</div>
    <div>
      <div class="header-title">TradeFlow Cookie Capture</div>
      <div class="header-sub">Captura cookies para importação</div>
    </div>
  </div>

  <div class="body" id="main-body">
    <div class="domain-box">
      <span>🌐</span>
      <div>
        <div style="font-size:11px;color:#888;">Site actual</div>
        <div class="domain-name" id="domain">A carregar...</div>
      </div>
    </div>

    <button class="btn btn-primary" id="btn-capture">
      📥 Capturar e enviar cookies
    </button>
    <button class="btn btn-outline" id="btn-options">
      ⚙️ Configurar endpoint
    </button>

    <div class="status" id="status"></div>
    <div class="count" id="count"></div>
  </div>

  <div class="not-configured" id="not-configured" style="display:none;">
    <strong>Endpoint não configurado</strong>
    Configura o URL do TradeFlow e o token antes de capturar cookies.
    <button class="btn btn-primary" id="btn-options-2" style="margin-top:12px;">
      ⚙️ Configurar agora
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
