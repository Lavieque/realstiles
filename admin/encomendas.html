<!DOCTYPE html>
<html lang="pt">
<head>
    <link rel="icon" type="image/svg+xml" href="../img/favicon.svg">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Encomendas — Real Stiles Admin</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/admin.css"/>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><a href="../index.html"><img src="../img/logo.png" alt="Real Stiles" style="height:48px;"/></a><p>Painel de administração</p></div>
    <div class="sidebar-nav">
      <div class="sidebar-section">Principal</div>
      <a href="index.html"><span class="icon">📊</span> Dashboard</a>
      <a href="encomendas.html" class="active"><span class="icon">📦</span> Encomendas</a>
      <div class="sidebar-section">Catálogo</div>
      <a href="produtos.html"><span class="icon">👕</span> Produtos</a>
      <a href="importar.html"><span class="icon">🔗</span> Importar via link</a>
      <div class="sidebar-section">Clientes</div>
      <a href="clientes.html"><span class="icon">👥</span> Clientes</a>
      <div class="sidebar-section">Site</div>
      <a href="conteudo.html"><span class="icon">✏️</span> Conteúdo do site</a>
    </div>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar" id="admin-avatar">A</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-nome" id="admin-nome">Admin</div>
          <div class="sidebar-user-role">Administrador</div>
        </div>
      </div>
      <button onclick="window._logout()" class="btn btn-outline btn-sm btn-full" style="margin-top:8px">Sair</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar"><h1>Encomendas</h1></div>
    <div class="admin-content">

      <!-- FILTROS ESTADO -->
      <div class="filtros" style="margin-bottom:20px;">
        <button class="filtro-btn active" onclick="filtrar(null,this)">Todas</button>
        <button class="filtro-btn" onclick="filtrar('pendente',this)">⏳ Pendentes</button>
        <button class="filtro-btn" onclick="filtrar('confirmada',this)">✅ Confirmadas</button>
        <button class="filtro-btn" onclick="filtrar('enviada',this)">🚚 Enviadas</button>
        <button class="filtro-btn" onclick="filtrar('entregue',this)">📦 Entregues</button>
        <button class="filtro-btn" onclick="filtrar('cancelada',this)">❌ Canceladas</button>
      </div>

      <div class="table-card">
        <div class="table-wrapper">
          <table>
            <thead><tr>
              <th>Ref.</th><th>Cliente</th><th>Itens</th>
              <th>Total</th><th>Estado</th><th>Data</th><th>Acções</th>
            </tr></thead>
            <tbody id="tb-encomendas">
              <tr><td colspan="7" class="loading"><div class="spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- MODAL DETALHE -->
<div class="modal-overlay" id="modal-encomenda">
  <div class="modal" style="max-width:560px;">
    <div class="modal-header">
      <h2 id="modal-ref">Encomenda</h2>
      <button class="modal-close" onclick="fecharModal()">✕</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { requireAdmin, logout, getPerfil } from '../js/auth.js';
  import { getTodasEncomendas, getEncomenda, actualizarEstado, badgeEstado, formatarData } from '../js/encomendas.js';
  import { mostrarToast } from '../js/carrinho.js';

  window._logout = logout;
  let todasEncomendas = [];
  let estadoActual = null;

  const user = await requireAdmin();
  const perfil = await getPerfil(user.uid);
  document.getElementById('admin-nome').textContent = perfil?.nome || user.email;
  document.getElementById('admin-avatar').textContent = (perfil?.nome || 'A')[0].toUpperCase();

  // Abrir detalhe se URL tiver ?id=
  const params = new URLSearchParams(window.location.search);
  if (params.get('id')) setTimeout(() => verDetalhe(params.get('id')), 1000);

  async function carregar(estado = null) {
    estadoActual = estado;
    todasEncomendas = await getTodasEncomendas(estado);
    renderTabela(todasEncomendas);
  }

  function renderTabela(lista) {
    const tb = document.getElementById('tb-encomendas');
    if (lista.length === 0) {
      tb.innerHTML = '<tr><td colspan="7" style="text-align:center;padding:40px;color:var(--gray-400)">Sem encomendas</td></tr>';
      return;
    }
    tb.innerHTML = lista.map(e => `
      <tr>
        <td><code style="font-size:12px">#${e.id.substring(0,8).toUpperCase()}</code></td>
        <td style="font-size:13px">${e.cliente_email || '—'}</td>
        <td style="font-size:13px">${e.itens?.length || 0} artigos</td>
        <td><strong>${e.total?.toFixed(2)} MZN</strong></td>
        <td>${badgeEstado(e.estado)}</td>
        <td style="font-size:12px;color:var(--gray-600)">${formatarData(e.criado_em)}</td>
        <td><button class="btn btn-outline btn-sm" onclick="verDetalhe('${e.id}')">Ver</button></td>
      </tr>
    `).join('');
  }

  window.filtrar = (estado, btn) => {
    document.querySelectorAll('.filtro-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    carregar(estado);
  };

  window.verDetalhe = async (id) => {
    const e = await getEncomenda(id);
    if (!e) return;
    document.getElementById('modal-ref').textContent = `Encomenda #${id.substring(0,8).toUpperCase()}`;
    document.getElementById('modal-body').innerHTML = `
      <div style="margin-bottom:16px;">${badgeEstado(e.estado)}</div>
      <div style="background:var(--gray-100);border-radius:10px;padding:16px;margin-bottom:16px;font-size:13px;line-height:1.8;">
        <strong>Cliente:</strong> ${e.cliente_email}<br/>
        <strong>Telefone:</strong> ${e.telefone_contacto || '—'}<br/>
        <strong>Morada:</strong> ${e.morada_entrega || '—'}, ${e.cidade_entrega || ''}<br/>
        ${e.notas ? `<strong>Notas:</strong> ${e.notas}` : ''}
      </div>
      <table style="width:100%;font-size:13px;border-collapse:collapse;margin-bottom:16px;">
        ${(e.itens || []).map(i => `
          <tr style="border-bottom:1px solid var(--gray-200)">
            <td style="padding:8px 0">${i.nome} ${i.tamanho ? `(${i.tamanho})` : ''}</td>
            <td style="padding:8px;text-align:center">×${i.quantidade}</td>
            <td style="padding:8px;text-align:right;font-weight:600">${(i.preco*i.quantidade).toFixed(2)} MZN</td>
          </tr>
        `).join('')}
        <tr><td colspan="2" style="padding:10px 0;font-weight:700">Total</td><td style="padding:10px;text-align:right;font-weight:700">${e.total?.toFixed(2)} MZN</td></tr>
      </table>
      <div class="form-group">
        <label>Alterar estado</label>
        <select id="novo-estado" style="width:100%;padding:10px;border:1.5px solid var(--gray-200);border-radius:8px;font-family:Inter,sans-serif;font-size:14px;">
          <option value="pendente" ${e.estado==='pendente'?'selected':''}>⏳ Pendente</option>
          <option value="confirmada" ${e.estado==='confirmada'?'selected':''}>✅ Confirmada</option>
          <option value="enviada" ${e.estado==='enviada'?'selected':''}>🚚 Enviada</option>
          <option value="entregue" ${e.estado==='entregue'?'selected':''}>📦 Entregue</option>
          <option value="cancelada" ${e.estado==='cancelada'?'selected':''}>❌ Cancelada</option>
        </select>
      </div>
      <div class="form-group">
        <label>Nota interna</label>
        <textarea id="nota-admin" rows="2" style="width:100%;padding:10px;border:1.5px solid var(--gray-200);border-radius:8px;font-family:Inter,sans-serif;font-size:13px;">${e.notas_admin || ''}</textarea>
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end;">
        <button class="btn btn-outline" onclick="fecharModal()">Fechar</button>
        <button class="btn btn-primary" onclick="guardarEstado('${id}')">Guardar alterações</button>
      </div>
    `;
    document.getElementById('modal-encomenda').classList.add('open');
  };

  window.guardarEstado = async (id) => {
    const estado = document.getElementById('novo-estado').value;
    const nota = document.getElementById('nota-admin').value;
    try {
      await actualizarEstado(id, estado, nota);
      mostrarToast('Encomenda actualizada!', 'success');
      fecharModal();
      await carregar(estadoActual);
    } catch (e) { mostrarToast('Erro ao actualizar', 'error'); }
  };

  window.fecharModal = () => document.getElementById('modal-encomenda').classList.remove('open');

  carregar();
</script>
<style>
.whatsapp-float{position:fixed;bottom:28px;right:28px;z-index:9000;width:56px;height:56px;border-radius:50%;background:#25D366;color:white;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(37,211,102,.45);text-decoration:none;transition:transform .2s,box-shadow .2s}
.whatsapp-float:hover{transform:scale(1.1);box-shadow:0 6px 28px rgba(37,211,102,.6)}
.whatsapp-float-tooltip{position:absolute;right:66px;top:50%;transform:translateY(-50%);background:#111;color:white;font-size:12px;font-weight:500;padding:6px 12px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;font-family:Inter,sans-serif}
.whatsapp-float:hover .whatsapp-float-tooltip{opacity:1}
</style>
</body>
</html>
