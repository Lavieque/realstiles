<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Produtos — Real Stiles Admin</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/admin.css"/>
  <style>
    .imgs-grid { display: flex; flex-wrap: wrap; gap: 10px; min-height: 20px; margin-bottom: 4px; }
    .img-item { position: relative; width: 84px; flex-shrink: 0; }
    .img-item-thumb { width: 84px; height: 106px; object-fit: cover; border-radius: 8px; border: 1.5px solid var(--gray-200); display: block; }
    .img-item-badge { position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%); font-size: 10px; background: var(--black); color: white; padding: 2px 7px; border-radius: 4px; white-space: nowrap; pointer-events: none; }
    .img-item-remove { position: absolute; top: -7px; right: -7px; width: 22px; height: 22px; border-radius: 50%; background: var(--red); color: white; border: 2px solid white; cursor: pointer; font-size: 13px; display: flex; align-items: center; justify-content: center; font-family: 'Inter', sans-serif; font-weight: 700; }
    .img-item-order { display: flex; justify-content: center; gap: 4px; margin-top: 4px; }
    .img-item-order button { border: 1px solid var(--gray-200); background: white; border-radius: 4px; width: 26px; height: 22px; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center; }
    .img-item-order button:hover { background: var(--gray-100); }
    .imgs-add-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .imgs-vazia { font-size: 13px; color: var(--gray-400); padding: 4px 0; }
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><a href="../index.html"><img src="../img/logo.png" alt="Real Stiles" style="height:48px;"/></a><p>Painel de administração</p></div>
    <div class="sidebar-nav">
      <div class="sidebar-section">Principal</div>
      <a href="index.html"><span class="icon">📊</span> Dashboard</a>
      <a href="encomendas.html"><span class="icon">📦</span> Encomendas</a>
      <div class="sidebar-section">Catálogo</div>
      <a href="produtos.html" class="active"><span class="icon">👕</span> Produtos</a>
      <a href="importar.html"><span class="icon">🔗</span> Importar via link</a>
      <div class="sidebar-section">Clientes</div>
      <a href="clientes.html"><span class="icon">👥</span> Clientes</a>
      <div class="sidebar-section">Site</div>
      <a href="conteudo.html"><span class="icon">✏️</span> Conteúdo do site</a>
    </div>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar" id="admin-avatar">A</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-nome" id="admin-nome">Admin</div>
          <div class="sidebar-user-role">Administrador</div>
        </div>
      </div>
      <button onclick="window._logout()" class="btn btn-outline btn-sm btn-full" style="margin-top:8px">Sair</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-content">
      <div class="table-card">
        <div class="table-card-header">
          <h2 id="total-label">Todos os produtos</h2>
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;">
            <div class="search-bar">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
              <input type="text" placeholder="Pesquisar..." oninput="pesquisar(this.value)"/>
            </div>
            <a href="importar.html" class="btn btn-outline btn-sm">🔗 Importar via link</a>
            <button class="btn btn-primary btn-sm" onclick="abrirModalNovo()">+ Novo produto</button>
          </div>
        </div>
        <div class="table-wrapper">
          <table>
            <thead><tr>
              <th>Produto</th><th>Categoria</th><th>Preço</th>
              <th>Stock</th><th>Estado</th><th>Acções</th>
            </tr></thead>
            <tbody id="tb-produtos">
              <tr><td colspan="6" class="loading"><div class="spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- MODAL PRODUTO -->
<div class="modal-overlay" id="modal-produto">
  <div class="modal" style="max-width:600px;">
    <div class="modal-header">
      <h2 id="modal-titulo">Novo produto</h2>
      <button class="modal-close" onclick="fecharModal()">✕</button>
    </div>
    <div class="form-grid-2">
      <input type="hidden" id="edit-id"/>
      <div class="form-group" style="grid-column:1/-1">
        <label>Nome *</label>
        <input type="text" id="edit-nome"/>
      </div>
      <div class="form-group">
        <label>Preço (MZN) *</label>
        <input type="number" id="edit-preco" step="0.01"/>
      </div>
      <div class="form-group">
        <label>Preço original</label>
        <input type="number" id="edit-preco-orig" step="0.01"/>
      </div>
      <div class="form-group">
        <label>Categoria</label>
        <select id="edit-categoria">
          <option value="">Seleccionar...</option>
          <option>camisas</option><option>calças</option>
          <option>vestidos</option><option>casacos</option>
          <option>sapatos</option><option>acessórios</option><option>outros</option>
        </select>
      </div>
      <div class="form-group">
        <label>Stock</label>
        <input type="number" id="edit-stock" value="0"/>
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label>Descrição</label>
        <textarea id="edit-descricao" rows="2"></textarea>
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label>Tamanhos (vírgula)</label>
        <input type="text" id="edit-tamanhos" placeholder="S, M, L, XL"/>
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label>Imagens <span style="font-weight:400;color:var(--gray-400)">(a primeira é a principal)</span></label>
        <div class="imgs-grid" id="edit-imgs-grid"></div>
        <div class="imgs-add-row">
          <input type="url" id="edit-nova-img-url" placeholder="https://... colar URL de imagem"
            style="flex:1;padding:10px 12px;border:1.5px solid var(--gray-200);border-radius:8px;font-size:13px;font-family:Inter,sans-serif;outline:none;"
            onfocus="this.style.borderColor='var(--black)'" onblur="this.style.borderColor='var(--gray-200)'"
            onkeydown="if(event.key==='Enter'){adicionarUrlEdit();event.preventDefault()}"/>
          <button class="btn btn-outline btn-sm" onclick="adicionarUrlEdit()" type="button">+ URL</button>
          <button class="btn btn-outline btn-sm" onclick="document.getElementById('edit-ficheiro').click()" type="button">📁 Upload</button>
        </div>
        <input type="file" id="edit-ficheiro" accept="image/*" multiple style="display:none;" onchange="uploadImagensEdit(this)"/>
        <div id="upload-progress-wrap" style="display:none;margin-top:8px;">
          <div style="background:var(--gray-100);border-radius:6px;height:6px;overflow:hidden;">
            <div id="upload-progress-bar" style="height:100%;background:var(--accent);width:0%;transition:width 0.2s;border-radius:6px;"></div>
          </div>
          <p id="upload-progress-label" style="font-size:11px;color:var(--gray-500);margin-top:4px;">A carregar...</p>
        </div>
      </div>
      <div class="form-group" style="grid-column:1/-1">
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;">
          <input type="checkbox" id="edit-activo" checked/> Activo (visível na loja)
        </label>
        <label style="display:flex;align-items:center;gap:8px;cursor:pointer;margin-top:8px;">
          <input type="checkbox" id="edit-destaque"/> Produto em destaque
        </label>
      </div>
    </div>
    <div style="display:flex;gap:10px;justify-content:flex-end;margin-top:16px;">
      <button class="btn btn-outline" onclick="fecharModal()">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarEdicao()" id="btn-guardar-edit">Guardar</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script type="module">
  import { requireAdmin, logout, getPerfil } from '../js/auth.js';
  import { getProdutos, criarProduto, actualizarProduto, apagarProduto } from '../js/produtos.js';
  import { mostrarToast } from '../js/carrinho.js';
  import { uploadParaCloudinary } from '../js/cloudinary.js';

  window._logout = logout;
  let todosProdutos = [];
  let imagensEdit = [];

  // ── GESTOR IMAGENS MODAL ──
  function renderImagensEdit() {
    const grid = document.getElementById('edit-imgs-grid');
    if (!imagensEdit.length) {
      grid.innerHTML = '<p class="imgs-vazia">Nenhuma imagem adicionada.</p>';
      return;
    }
    grid.innerHTML = imagensEdit.map((src, i) => `
      <div class="img-item">
        <img class="img-item-thumb" src="${src}" alt="img ${i+1}"
          onerror="this.src='https://via.placeholder.com/84x106?text=Erro'"/>
        ${i === 0 ? '<span class="img-item-badge">Principal</span>' : ''}
        <button class="img-item-remove" onclick="removerImagemEdit(${i})" title="Remover">×</button>
        <div class="img-item-order">
          <button onclick="moverImagemEdit(${i},-1)" ${i===0?'disabled':''}>‹</button>
          <button onclick="moverImagemEdit(${i},1)" ${i===imagensEdit.length-1?'disabled':''}>›</button>
        </div>
      </div>
    `).join('');
  }
  window.removerImagemEdit = (i) => { imagensEdit.splice(i, 1); renderImagensEdit(); };
  window.moverImagemEdit = (i, dir) => {
    const j = i + dir;
    if (j < 0 || j >= imagensEdit.length) return;
    [imagensEdit[i], imagensEdit[j]] = [imagensEdit[j], imagensEdit[i]];
    renderImagensEdit();
  };
  window.adicionarUrlEdit = () => {
    const input = document.getElementById('edit-nova-img-url');
    const url = input.value.trim();
    if (!url || !url.startsWith('http')) return mostrarToast('URL inválido', 'error');
    if (imagensEdit.includes(url)) return mostrarToast('Já existe', 'error');
    imagensEdit.push(url); renderImagensEdit(); input.value = '';
  };
  window.uploadImagensEdit = async (input) => {
    const files = Array.from(input.files);
    if (!files.length) return;
    const progressWrap = document.getElementById('upload-progress-wrap');
    const progressBar = document.getElementById('upload-progress-bar');
    const progressLabel = document.getElementById('upload-progress-label');
    progressWrap.style.display = 'block';
    for (let fi = 0; fi < files.length; fi++) {
      try {
        progressLabel.textContent = `A carregar ${fi+1}/${files.length}...`;
        const url = await uploadParaCloudinary(files[fi], (pct) => {
          progressBar.style.width = pct + '%';
        });
        imagensEdit.push(url);
        renderImagensEdit();
      } catch (e) { mostrarToast('Erro upload: ' + e.message, 'error'); }
    }
    progressWrap.style.display = 'none';
    progressBar.style.width = '0%';
    input.value = '';
  };

  const user = await requireAdmin();
  const perfil = await getPerfil(user.uid);
  document.getElementById('admin-nome').textContent = perfil?.nome || user.email;
  document.getElementById('admin-avatar').textContent = (perfil?.nome || 'A')[0].toUpperCase();

  async function carregar() {
    todosProdutos = await getProdutos({ max: 200, activo: null });
    renderTabela(todosProdutos);
    document.getElementById('total-label').textContent = `Todos os produtos (${todosProdutos.length})`;
  }

  function renderTabela(lista) {
    const tb = document.getElementById('tb-produtos');
    if (lista.length === 0) {
      tb.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--gray-400)">Sem produtos</td></tr>';
      return;
    }
    tb.innerHTML = lista.map(p => `
      <tr>
        <td>
          <div style="display:flex;align-items:center;gap:10px;">
            <img src="${p.imagens?.[0] || 'https://via.placeholder.com/40x50'}" style="width:36px;height:48px;object-fit:cover;border-radius:6px;border:1px solid var(--gray-200)"/>
            <span style="font-weight:500;font-size:13px;">${p.nome}</span>
          </div>
        </td>
        <td><span style="font-size:12px;background:var(--gray-100);padding:3px 8px;border-radius:6px;">${p.categoria || '—'}</span></td>
        <td><strong>${p.preco?.toFixed(2)} MZN</strong></td>
        <td><span style="color:${p.stock < 3 ? 'var(--red)' : 'inherit'}">${p.stock ?? 0}</span></td>
        <td><span class="badge-estado ${p.activo ? 'badge-entregue' : 'badge-cancelada'}">${p.activo ? 'Activo' : 'Inactivo'}</span></td>
        <td>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-outline btn-sm" onclick="editar('${p.id}')">Editar</button>
            <button class="btn btn-danger btn-sm" onclick="apagar('${p.id}', '${p.nome.replace(/'/g, "\\'")}')">Apagar</button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  window.pesquisar = (termo) => {
    const t = termo.toLowerCase();
    renderTabela(todosProdutos.filter(p =>
      p.nome?.toLowerCase().includes(t) || p.categoria?.toLowerCase().includes(t)
    ));
  };

  function resetImagens() {
    imagensEdit = [];
    document.getElementById('edit-ficheiro').value = '';
    document.getElementById('upload-progress-wrap').style.display = 'none';
    document.getElementById('upload-progress-bar').style.width = '0%';
    renderImagensEdit();
  }

  window.abrirModalNovo = () => {
    document.getElementById('edit-id').value = '';
    document.getElementById('modal-titulo').textContent = 'Novo produto';
    ['nome','descricao','tamanhos'].forEach(f => document.getElementById('edit-'+f).value = '');
    document.getElementById('edit-preco').value = '';
    document.getElementById('edit-preco-orig').value = '';
    document.getElementById('edit-stock').value = '0';
    document.getElementById('edit-activo').checked = true;
    document.getElementById('edit-destaque').checked = false;
    resetImagens();
    document.getElementById('modal-produto').classList.add('open');
  };

  window.editar = (id) => {
    const p = todosProdutos.find(x => x.id === id);
    if (!p) return;
    document.getElementById('edit-id').value = id;
    document.getElementById('modal-titulo').textContent = 'Editar produto';
    document.getElementById('edit-nome').value = p.nome || '';
    document.getElementById('edit-preco').value = p.preco || '';
    document.getElementById('edit-preco-orig').value = p.preco_original || '';
    document.getElementById('edit-categoria').value = p.categoria || '';
    document.getElementById('edit-stock').value = p.stock ?? 0;
    document.getElementById('edit-descricao').value = p.descricao || '';
    document.getElementById('edit-tamanhos').value = (p.tamanhos || []).join(', ');
    document.getElementById('edit-activo').checked = p.activo !== false;
    document.getElementById('edit-destaque').checked = p.destaque || false;
    imagensEdit = [...(p.imagens || [])];
    document.getElementById('edit-ficheiro').value = '';
    document.getElementById('upload-progress-wrap').style.display = 'none';
    renderImagensEdit();
    document.getElementById('modal-produto').classList.add('open');
  };

  window.fecharModal = () => document.getElementById('modal-produto').classList.remove('open');

  window.guardarEdicao = async () => {
    const id = document.getElementById('edit-id').value;
    const nome = document.getElementById('edit-nome').value.trim();
    const preco = parseFloat(document.getElementById('edit-preco').value);
    if (!nome || !preco) return mostrarToast('Nome e preço são obrigatórios', 'error');

    const btn = document.getElementById('btn-guardar-edit');
    btn.disabled = true; btn.textContent = 'A guardar...';

    const dados = {
      nome, preco,
      preco_original: parseFloat(document.getElementById('edit-preco-orig').value) || null,
      categoria: document.getElementById('edit-categoria').value,
      stock: parseInt(document.getElementById('edit-stock').value) || 0,
      descricao: document.getElementById('edit-descricao').value.trim(),
      tamanhos: document.getElementById('edit-tamanhos').value.split(',').map(t => t.trim()).filter(Boolean),
      imagens: imagensEdit,
      activo: document.getElementById('edit-activo').checked,
      destaque: document.getElementById('edit-destaque').checked,
    };

    try {
      if (id) { await actualizarProduto(id, dados); }
      else { await criarProduto(dados); }
      mostrarToast('Produto guardado!', 'success');
      fecharModal();
      await carregar();
    } catch (e) {
      mostrarToast('Erro: ' + e.message, 'error');
    } finally {
      btn.disabled = false; btn.textContent = 'Guardar';
    }
  };

  window.apagar = async (id, nome) => {
    if (!confirm(`Tens a certeza que queres apagar "${nome}"?`)) return;
    try {
      await apagarProduto(id);
      mostrarToast('Produto apagado', 'success');
      await carregar();
    } catch (e) { mostrarToast('Erro ao apagar', 'error'); }
  };

  carregar();
</script>
</body>
</html>
