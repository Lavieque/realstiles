<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clientes — Real Stiles Admin</title>
  <link rel="stylesheet" href="../css/style.css"/>
  <link rel="stylesheet" href="../css/admin.css"/>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar">
    <div class="sidebar-logo"><a href="../index.html"><img src="../img/logo.png" alt="Real Stiles" style="height:48px;"/></a><p>Painel de administração</p></div>
    <div class="sidebar-nav">
      <div class="sidebar-section">Principal</div>
      <a href="index.html"><span class="icon">📊</span> Dashboard</a>
      <a href="encomendas.html"><span class="icon">📦</span> Encomendas</a>
      <div class="sidebar-section">Catálogo</div>
      <a href="produtos.html"><span class="icon">👕</span> Produtos</a>
      <a href="importar.html"><span class="icon">🔗</span> Importar via link</a>
      <div class="sidebar-section">Clientes</div>
      <a href="clientes.html" class="active"><span class="icon">👥</span> Clientes</a>
    </div>
    <div class="sidebar-footer">
      <div class="sidebar-user">
        <div class="sidebar-user-avatar" id="admin-avatar">A</div>
        <div class="sidebar-user-info">
          <div class="sidebar-user-nome" id="admin-nome">Admin</div>
          <div class="sidebar-user-role">Administrador</div>
        </div>
      </div>
      <button onclick="window._logout()" class="btn btn-outline btn-sm btn-full" style="margin-top:8px">Sair</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>Clientes</h1>
    </div>

    <div class="admin-content">
      <div class="table-card">
        <div class="table-card-header">
          <h2 id="total-label">Todos os clientes</h2>
          <div class="search-bar">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
            <input type="text" placeholder="Pesquisar por nome ou email..." oninput="pesquisar(this.value)"/>
          </div>
        </div>
        <div class="table-wrapper">
          <table>
            <thead><tr>
              <th>Cliente</th><th>Email</th><th>Telefone</th>
              <th>Registado em</th><th>Perfil</th><th>Acções</th>
            </tr></thead>
            <tbody id="tb-clientes">
              <tr><td colspan="6" class="loading"><div class="spinner"></div></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </main>
</div>

<div id="toast"></div>

<script type="module">
  import { requireAdmin, logout, getPerfil } from '../js/auth.js';
  import { db } from '../js/firebase.js';
  import {
    collection, getDocs, doc, updateDoc, orderBy, query
  } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
  import { mostrarToast } from '../js/carrinho.js';
  import { confirmar } from '../js/confirmar.js';

  window._logout = logout;
  let todosClientes = [];

  const user = await requireAdmin();
  const perfil = await getPerfil(user.uid);
  document.getElementById('admin-nome').textContent = perfil?.nome || user.email;
  document.getElementById('admin-avatar').textContent = (perfil?.nome || 'A')[0].toUpperCase();

  async function carregar() {
    const tb = document.getElementById('tb-clientes');
    try {
      const q = query(collection(db, 'clientes'), orderBy('criado_em', 'desc'));
      const snap = await getDocs(q);
      todosClientes = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderTabela(todosClientes);
      document.getElementById('total-label').textContent = `Todos os clientes (${todosClientes.length})`;
    } catch (e) {
      tb.innerHTML = `<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--red)">Erro ao carregar clientes: ${e.message}</td></tr>`;
    }
  }

  function formatarData(ts) {
    if (!ts) return '—';
    const d = ts.toDate ? ts.toDate() : new Date(ts);
    return d.toLocaleDateString('pt-PT', { day: '2-digit', month: '2-digit', year: 'numeric' });
  }

  function renderTabela(lista) {
    const tb = document.getElementById('tb-clientes');
    if (lista.length === 0) {
      tb.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:40px;color:var(--gray-400)">Sem clientes</td></tr>';
      return;
    }
    tb.innerHTML = lista.map(c => `
      <tr>
        <td>
          <div style="display:flex;align-items:center;gap:10px;">
            <div style="width:36px;height:36px;border-radius:50%;background:var(--gray-100);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;color:var(--gray-600);flex-shrink:0;">
              ${(c.nome || c.email || '?')[0].toUpperCase()}
            </div>
            <span style="font-weight:500;font-size:13px;">${c.nome || '—'}</span>
          </div>
        </td>
        <td style="font-size:13px;color:var(--gray-600);">${c.email || '—'}</td>
        <td style="font-size:13px;">${c.telefone || '—'}</td>
        <td style="font-size:12px;color:var(--gray-500);">${formatarData(c.criado_em)}</td>
        <td>
          ${c.admin
            ? '<span class="badge-estado badge-entregue">Admin</span>'
            : '<span class="badge-estado" style="background:var(--gray-100);color:var(--gray-600);">Cliente</span>'
          }
        </td>
        <td>
          <div style="display:flex;gap:6px;">
            <button class="btn btn-outline btn-sm" onclick="toggleAdmin('${c.id}', ${c.admin})">
              ${c.admin ? 'Remover admin' : 'Tornar admin'}
            </button>
          </div>
        </td>
      </tr>
    `).join('');
  }

  window.pesquisar = (termo) => {
    const t = termo.toLowerCase();
    renderTabela(todosClientes.filter(c =>
      c.nome?.toLowerCase().includes(t) || c.email?.toLowerCase().includes(t)
    ));
  };

  window.toggleAdmin = async (id, isAtualmenteAdmin) => {
    const acao = isAtualmenteAdmin ? 'remover o acesso de admin' : 'tornar este cliente admin';
    if (!await confirmar(`Tens a certeza que queres ${acao}?`, { titulo: 'Alterar permissões?', icone: '🔑', labelOk: 'Confirmar', corOk: 'btn-primary' })) return;
    try {
      await updateDoc(doc(db, 'clientes', id), { admin: !isAtualmenteAdmin });
      mostrarToast('Perfil actualizado!', 'success');
      await carregar();
    } catch (e) {
      mostrarToast('Erro ao actualizar: ' + e.message, 'error');
    }
  };

  carregar();
</script>
<style>
.whatsapp-float{position:fixed;bottom:28px;right:28px;z-index:9000;width:56px;height:56px;border-radius:50%;background:#25D366;color:white;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(37,211,102,.45);text-decoration:none;transition:transform .2s,box-shadow .2s}
.whatsapp-float:hover{transform:scale(1.1);box-shadow:0 6px 28px rgba(37,211,102,.6)}
.whatsapp-float-tooltip{position:absolute;right:66px;top:50%;transform:translateY(-50%);background:#111;color:white;font-size:12px;font-weight:500;padding:6px 12px;border-radius:8px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .2s;font-family:Inter,sans-serif}
.whatsapp-float:hover .whatsapp-float-tooltip{opacity:1}
</style>
</body>
</html>
